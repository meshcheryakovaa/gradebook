name: Upload standalone Gradebook v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-standalone-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')

          css = '\n\n'.join(
              p.read_text(encoding='utf-8')
              for p in sorted(Path('css').glob('part-*.css'))
          )
          css_links = '\n'.join(
              f'<link rel="stylesheet" href="css/part-{i:02d}.css">'
              for i in range(1, 5)
          )
          html = html.replace(css_links, '<style>\n' + css + '\n</style>')

          js = '\n\n'.join(
              p.read_text(encoding='utf-8')
              for p in sorted(Path('js').glob('part-*.js'))
          )
          js_tags = '\n'.join(
              f'<script src="js/part-{i:02d}.js"></script>'
              for i in range(1, 11)
          )
          html = html.replace(js_tags, '<script>\n' + js + '\n</script>')

          html = html.replace(
              '<title>Журнал учебных занятий</title>',
              '<title>Gradebook v13 — Журнал учебных занятий</title>'
          )
          html = html.replace(
              '<!doctype html>',
              '<!doctype html>\n<!-- Gradebook v13 standalone release: CSS and JavaScript are embedded in this single file. -->',
              1,
          )

          if 'href="css/' in html or 'src="js/' in html:
              raise SystemExit('Standalone build still contains local CSS/JS references')

          Path('Gradebook-v13.html').write_text(html, encoding='utf-8')
          print(f'Built Gradebook-v13.html: {len(html.encode("utf-8"))} bytes')
          PY

      - name: Upload standalone file and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v13 Gradebook-v13.html --clobber --repo "$GITHUB_REPOSITORY"

          cat > /tmp/release-notes.md <<'EOF'
          ## Gradebook v13

          Учебный электронный журнал для преподавателя.

          ### Скачать и запустить

          **Скачайте файл `Gradebook-v13.html` из раздела Assets и откройте его двойным кликом в современном браузере.**

          Ничего устанавливать не нужно. Python, сервер, дополнительные CSS/JS-файлы и распаковка архива не требуются — весь интерфейс, стили и логика приложения находятся внутри одного HTML-файла.

          ### Основные возможности
          - журнал оценок по учебным группам;
          - группы и подгруппы студентов;
          - разные типы занятий с цветами и обозначениями;
          - календарь занятий: месяц, неделя и список;
          - карточка студента со всеми занятиями, оценками и комментариями;
          - табличный и матричный режим занятия;
          - схема рассадки студентов;
          - копирование и вставка оценок между занятиями;
          - объединённые занятия нескольких групп;
          - печать журнала на A4;
          - экспорт и импорт базы в JSON;
          - светлая и тёмная темы;
          - синхронизация и история версий через Яндекс Диск.

          ### Хранение данных
          Данные журнала по умолчанию сохраняются локально в браузере (`localStorage`). Для резервного копирования используйте экспорт базы в JSON. Для работы на нескольких устройствах можно настроить синхронизацию с Яндекс Диском.

          > Архивы **Source code (zip)** и **Source code (tar.gz)** нужны только для разработки. Для обычной работы скачивайте **`Gradebook-v13.html`**.
          EOF

          gh release edit v13 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gradebook v13" \
            --notes-file /tmp/release-notes.md
