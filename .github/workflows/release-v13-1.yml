name: Publish Gradebook v13.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v13-1.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v13-1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test calculations and sorting
        run: node --test tests/performance.test.cjs
      - name: Build single-file HTML
        run: python scripts/build_standalone.py 13.1
      - name: Check embedded JavaScript
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('dist/Gradebook-v13.1.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1)throw Error('Expected one embedded JavaScript bundle');
          new vm.Script(scripts[0][1]);
          JS
      - name: Publish release and HTML download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v13.1 dist/Gradebook-v13.1.html --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Gradebook v13.1 — успеваемость и навигация" --notes-file release-notes/v13.1.md --latest
