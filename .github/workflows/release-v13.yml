name: Create Gradebook v13 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v13 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v13 already exists."
            exit 0
          fi

          if git rev-parse v13 >/dev/null 2>&1; then
            echo "Tag v13 already exists."
          else
            git tag -a v13 "$GITHUB_SHA" -m "Gradebook v13"
            git push origin v13
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Gradebook v13

          Учебный электронный журнал для преподавателя, работающий непосредственно в браузере.

          ### Основные возможности
          - журнал оценок по учебным группам;
          - группы и подгруппы студентов;
          - разные типы занятий с цветами и обозначениями;
          - календарь занятий: месяц, неделя и список;
          - карточка студента со всеми занятиями, оценками и комментариями;
          - табличный и матричный режим занятия;
          - схема рассадки студентов;
          - копирование и вставка оценок между занятиями;
          - объединённые занятия нескольких групп;
          - печать журнала на A4;
          - экспорт и импорт базы в JSON;
          - светлая и тёмная темы;
          - синхронизация и история версий через Яндекс Диск.

          ### Запуск
          Скачайте исходный код релиза, распакуйте архив и откройте `index.html` в современном браузере.

          Для локального HTTP-сервера:

          ```bash
          python -m http.server 8000
          ```

          После этого откройте `http://localhost:8000`.

          ### Важно
          Данные журнала по умолчанию сохраняются локально в браузере (`localStorage`). Перед переносом на другой компьютер используйте экспорт базы либо настройте синхронизацию с Яндекс Диском.
          EOF

          gh release create v13 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gradebook v13" \
            --notes-file /tmp/release-notes.md
