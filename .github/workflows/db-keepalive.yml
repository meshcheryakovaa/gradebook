name: Database keep-alive

# A free Supabase project is paused after 7 days without requests. This calls a function
# that reads no data. Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets
# to enable it; without them the job does nothing.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Ping database
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets are not set; nothing to do."
            exit 0
          fi
          auth=()
          case "$SUPABASE_PUBLISHABLE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY");; esac
          curl -fsS --retry 3 -X POST "${SUPABASE_URL%/}/rest/v1/rpc/gradebook_ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "${auth[@]}" \
            -H 'Content-Type: application/json' -d '{}'
          echo
